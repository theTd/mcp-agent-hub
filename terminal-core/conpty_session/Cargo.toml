[package]
name = "conpty_session"
version = "0.1.0"
edition = "2021"
description = "Windows ConPTY sessions: command line parity, spawn, pipe I/O, job objects, session table"
publish = false

[dependencies]
# Pinned to the exact version already resolved in desktop/src-tauri/Cargo.lock (0.62.2): the app and
# the core then report the same Win32 binding generation, and a floating minor would drift silently.
# ConPTY, pipes, jobs, ToolHelp and NeedCurrentDirectoryForExePath come from here.
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Environment",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[[bin]]
name = "selftest"
path = "src/bin/selftest.rs"
